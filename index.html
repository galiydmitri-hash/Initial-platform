<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/menu.css">
    <link rel="stylesheet" href="Styles/containers.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&family=Space+Grotesk:wght@300..700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Навчальна платформа</title>
</head>
<body>
    <main>
        <div class="control-container">
            <button class="settings-btn">⚙️</button>
        </div>

        <button class="subject-card history">
            <img src="Image/history-icon.webp" alt="history-icon">
            <p>Історія України</p>
        </button>
        <button class="subject-card physics">
            <img src="Image/physics-icon.webp" alt="physics-icon">
            <p>Фізика</p>
        </button>
        <button class="subject-card geography">
            <img src="Image/geography-icon.webp" alt="geography-icon">
            <p>Географія</p>
        </button>
        <button class="subject-card civicEducation">
            <img src="Image/civicEducation-icon.webp" alt="civicEducation-icon">
            <p>Громадянська освіта</p>
        </button>
        <button class="subject-card law">
            <img src="Image/law-icon.webp" alt="law-icon">
            <p>Правознавство</p>
        </button>

        <div class="wrapper-list">
            <button class="open-list-btn">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M3 4h2v2H3V4zm4 2v-2h14v2H7zM3 11h2v2H3v-2zm4 2v-2h14v2H7zM3 18h2v2H3v-2zm4 2v-2h14v2H7z"/>
                </svg>
            </button>
            <div class="subject-list"></div>
        </div>

        <div class="wrapper">

            <div class="container history-container"></div>

            <div class="container physics-container"></div>

            <div class="container geography-container"></div>

            <div class="container civicEducation-container"></div>

            <div class="container law-container"></div>

            <div class="container settings-container">
                <button class="btn color-close-btn close-btn">
                    <div class="close-container">
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </button>
                <div class="main-color-container">
                    <h2>Змінити фон</h2>
                    <div class="color-container">
                        <div class="color color1">
                            <button class="downloadBg">+</button>
                        </div>
                        <div class="color color2">
                            <button class="downloadBg">+</button>
                        </div>
                        <div class="color color3">
                            <button class="downloadBg">+</button>
                        </div>
                        <div class="color color4">
                            <button class="downloadBg">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav">
                <button class="btn close-btn">
                    <div class="close-container">
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </button>
                <div class="btn-container">
                    <button class="info-btn all-info">Усе</button>
                    <button class="info-btn main-info">Основне</button>
                    <div class="bg"></div>
                </div>
                <button class="btn list-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9L12 15L18 9"
                                stroke="rgb(230, 230, 230)"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="list history-list"></div>
                <div class="list physics-list"></div>
                <div class="list geography-list"></div>
                <div class="list civicEducation-list"></div>
                <div class="list law-list"></div>
        </div>
    </main>
</body>
<script type="module" src="Js/index.js"></script>
</html>
